[project]
name = "rxdashboard"
version = "0.1.0"
description = "A synthetic, safety-aware Streamlit medication intelligence dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.2",
    "plotly>=5.24",
    "streamlit>=1.40",
    "pytest>=8.0",
    "pydantic>=2.7",
    "langchain>=1.0",
    "langchain-groq>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
rxdashboard = "rxdashboard.app:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
